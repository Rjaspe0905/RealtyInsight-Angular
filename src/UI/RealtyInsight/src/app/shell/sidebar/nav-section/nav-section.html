<nav class="nav-section">
    <div class="nav-label">{{section.label}}</div>
    @for (item of section.items; track $index) {
        @if(item.children){
            <app-nav-group [itemGroup]="item"></app-nav-group>
        } @else {
            <app-nav-link [item]="item"></app-nav-link>
        }
    }
</nav>
